plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    maven {
        name = "RedlanceMinecraft"
        url = uri("https://repo.redlance.org/public")
    }

    maven {
        name = "Kosmx"
        url = uri("https://maven.kosmx.dev/")
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = uri("https://api.modrinth.com/maven")
            }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "emotecraft-recording-addon" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Emotecraft API for compiling the packet bridge and its runtime mod artifact.
    compileOnly("io.github.kosmx.emotes:emotesFabric:${project.emotecraft_version}")
    implementation("maven.modrinth:${project.emotecraft_modrinth_project_id}:${project.emotecraft_modrinth_version_id}")

    // Flashback is the currently supported 26.3 recording backend.
    implementation("maven.modrinth:${project.flashback_modrinth_project_id}:${project.flashback_modrinth_version_id}")

    // Replay Mod is intentionally not a compile-time dependency: the only listed version
    // is for Minecraft 26.2. Its optional bridge uses reflection and is version-dependent.
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
